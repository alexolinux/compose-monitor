global:
  scrape_interval: 1m

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 1m
    static_configs:
      - targets: ['localhost:9090']

  # Replace Targets with the IP address(es) or hostname(s).
  - job_name: 'node-raspberry'
    static_configs:
      - targets: ['raspberry-node.local:9100']

  - job_name: 'node-blackberry'
    static_configs:
      - targets: ['blackberry-node.local:9100']

